spring:
  application:
    name: meetingmind

  mvc:
    async:
      request-timeout: 600000

  config:
    import: optional:file:../.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope: openid, profile, email

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/meetingmind}
    username: ${DATABASE_USERNAME:meetingmind}
    password: ${DATABASE_PASSWORD:meetingmind}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

  cache:
    type: redis

  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: meetingmind-analysis-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  ai:
    mcp:
      server:
        name: meetingmind
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
    vectorstore:
      pgvector:
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true
    openai:
      api-key: ${GROQ_API_KEY:dummy-key}
      base-url: https://api.groq.com/openai
      embedding:
        enabled: false
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}


meetingmind:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000
    bootstrap-user:
      enabled: true
      username: devuser
      password: devpassword
  ai:
    pipeline:
      summarizer-enabled: true
      extractor-enabled: true
      drafter-enabled: true
      reviewer-enabled: true
  rag:
    top-k: 4
    min-similarity: 0.50
  cache:
    ttl-minutes: 60

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
